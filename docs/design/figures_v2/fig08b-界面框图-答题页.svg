 font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172e3d" text-anchor="start">B.  60</text><rect x="36" y="426" width="700" height="46" rx="8" fill="#e7f5f1" stroke="#007c78" stroke-width="1.4"/><text x="58" y="456" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#172e3d" text-anchor="start">C.  17</text><text x="720" y="456" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#007c78" text-anchor="end">已选</text><rect x="36" y="484" width="700" height="46" rx="8" fill="#f2f5f7" stroke="#9fb3bf" stroke-width="1.4"/><text x="58" y="514" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172e3d" text-anchor="start">D.  45</text><text x="36" y="574" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">请写理由（原文保存，不会改写）：</text><rect x="36" y="586" width="700" height="86" rx="6" fill="#ffffff" stroke="#9fb3bf" stroke-width="1.4"/><text x="50" y="614" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#172e3d" text-anchor="start">17 不在 18—60 范围内，所以是无效等价类；</text><text x="50" y="640" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#172e3d" text-anchor="start">边界值应该取 17 这样的越界值来测试。</text><rect x="36" y="696" width="160" height="44" rx="6" fill="#007c78" stroke="#007c78" stroke-width="1.4"/><text x="116" y="724" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">提交作答</text><text x="214" y="724" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#526975" text-anchor="start">提交后不可修改理由</text><rect x="772" y="160" width="332" height="610" rx="8" fill="#f2f5f7" stroke="#9fb3bf" stroke-width="1.4"/><text x="790" y="194" font-family="PingFang