" font-size="12.5" font-weight="400" fill="#172e3d" text-anchor="start"></text><text x="330" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#172e3d" text-anchor="start">与等价类划分的关系：先划分等价类，再在每个</text><text x="330" y="408" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#172e3d" text-anchor="start">等价类的边界取测试用例。</text><rect x="326" y="446" width="452" height="38" rx="4" fill="#fff3d6" stroke="#875806" stroke-width="1.4"/><text x="334" y="470" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#875806" text-anchor="start">例：年龄输入 18—60，边界值为 17、18、60、61</text><text x="330" y="508" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#172e3d" text-anchor="start">17 和 61 是无效等价类，不能作为有效输入；</text><text x="330" y="536" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#172e3d" text-anchor="start">61 越界，说明边界有效性容易混淆。</text><rect x="310" y="730" width="484" height="10" rx="5" fill="#f2f5f7" stroke="#9fb3bf" stroke-width="1.4"/><rect x="310" y="730" width="300" height="10" rx="5" fill="#007c78" stroke="#007c78" stroke-width="1.4"/><rect x="838" y="160" width="266" height="610" rx="8" fill="#e7f5f1" stroke="#9fb3bf" stroke-width="1.4"/><text x="854" y="190" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007c78" text-anchor="start">本次学习</text><text x="854" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">知识点：边界值分析</text><text x="854" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#172e3d" text-anchor="start">资料：第 4 章 教材 PDF</text><text x="854" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#172e3d" text-anchor="