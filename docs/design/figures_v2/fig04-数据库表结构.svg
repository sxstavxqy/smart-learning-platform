</defs><rect x="0" y="0" width="1300" height="790" fill="#ffffff"/><text x="40" y="52" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#172e3d">图4 数据库表设计（PostgreSQL，共 20 张表）</text><text x="40" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#526975">A 内容 · B 考试 · C 学习 · D 答题 · E 诊断 · F 评测</text><line x1="40" y1="94" x2="1260" y2="94" stroke="#9fb3bf" stroke-width="1"/><rect x="40" y="120" width="340" height="412" rx="6" fill="#eaf2fb" stroke="#225f98" stroke-width="1.4"/><text x="54" y="147" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#225f98" text-anchor="start">A 用户与内容（9）</text><text x="54" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">users</text><text x="54" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">用户 / 角色</text><text x="54" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">courses</text><text x="54" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">课程</text><text x="54" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">chapters</text><text x="54" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">章节</text><text x="54" y="300" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">knowledge_points</text><text x="54" y="316" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">知识点 + 出处 + 审核状态</text><text x="54" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">kp_relations</text><text x="54" y="356" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">先修 / 相关 / 包含</text><text x="54" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">learning_resources</text><text x="54" y="396" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">原样资料（PDF / 视频）</text><text x="54" y="420" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">resource_kp</text><text x="54" y="436" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">资源—知识点 多对多</text><text x="54" y="460" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">questions</text><text x="54" y="476" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">题目 + 答案</text><text x="54" y="500" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">question_kp</text><text x="54" y="516" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">题目—知识点 多对多</text><rect x="40" y="560" width="340" height="132" rx="6" fill="#e7f5f1" stroke="#007c78" stroke-width="1.4"/><text x="54" y="587" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007c78" text-anchor="start">D 答题（2）</text><text x="54" y="620" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">quiz_attempts</text><text x="54" y="636" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">一次练习尝试</text><text x="54" y="660" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">answer_records</text><text x="54" y="676" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">对错 / 耗时 / 理由 / 判分方式</text><rect x="500" y="120" width="340" height="132" rx="6" fill="#fff3d6" stroke="#875806" stroke-width="1.4"/><text x="514" y="147" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#875806" text-anchor="start">B 考试与重点（2）</text><text x="514" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">exam_papers</text><text x="514" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">真题卷</text><text x="514" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">exam_kp_scores</text><text x="514" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">真题卷知识点分值</text><rect x="500" y="310" width="340" height="212" rx="6" fill="#fcecec" stroke="#a63636" stroke-width="1.4"/><text x="514" y="337" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#a63636" text-anchor="start">E 诊断（4）</text><text x="514" y="370" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">weakness_items</text><text x="514" y="386" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">个人薄弱项 + 证据充分性</text><text x="514" y="410" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">difficulty_points</text><text x="514" y="426" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">班级难点（薄弱人数）</text><text x="514" y="450" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">key_points</text><text x="514" y="466" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">真题重点（分值占比）</text><text x="514" y="490" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">diagnosis_reports</text><text x="514" y="506" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">诊断报告 + 明细</text><rect x="920" y="120" width="340" height="132" rx="6" fill="#e7f5f1" stroke="#007c78" stroke-width="1.4"/><text x="934" y="147" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007c78" text-anchor="start">C 学习（2）</text><text x="934" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">learning_sessions</text><text x="934" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">会话 + 断点位置</text><text x="934" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">learning_progress</text><text x="934" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">资源级进度快照</text><rect x="920" y="330" width="340" height="92" rx="6" fill="#f2f5f7" stroke="#8a9aa5" stroke-width="1.4"/><text x="934" y="357" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#8a9aa5" text-anchor="start">F 评测（1）</text><text x="934" y="390" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#172e3d" text-anchor="start">evaluation_runs</text><text x="934" y="406" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#526975" text-anchor="start">指标 / 值 / 版本 / 日期</text><text x="40" y="730" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#526975" text-anchor="start">关键约束：answer_records 唯一（attempt_id, question_id）；不记录行为事件，行为不进入诊断；阈值字段全部带 rule_version。</text><text x="40" y="752" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#526975" text-anchor="start">learning_resources 与 questions 都不直接挂 kp_id，分别经 resource_kp、question_kp 多对多关联，支持一个资源覆盖多个知识点。</text><text x="40" y="772" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8a9aa5">完整 DDL 见 db/schema_v2.sql · 2026-11-02</text></svg>